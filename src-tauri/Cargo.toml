[package]
name = "csir-net-tracker"
version = "0.1.0"
description = "Offline-first Windows study tracker for CSIR-UGC NET Physical Sciences"
authors = ["CrimsonVisa"]
license = "MIT"
repository = "https://github.com/CrimsonVisa/csir-net-tracker"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "csir_net_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"

[dev-dependencies]
tempfile = "3.27.0"
