[package]
name = "csir-net-tracker"
version = "2.0.0"
description = "Offline-first Windows study tracker for CSIR-UGC NET, GATE, TIFR and JEST Physics"
authors = ["CrimsonVisa"]
license = "MIT"
repository = "https://github.com/CrimsonVisa/Physics-exam-Tracker"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "csir_net_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = "0.4.45"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "gzip", "http2"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rusqlite_migration = "2.6.0"
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = { version = "2.8.0", default-features = false }
tauri-plugin-opener = "2.7.2"
url = "2.5.8"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
