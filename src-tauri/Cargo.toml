[package]
name = "csir-net-tracker"
version = "0.1.0"
description = "Offline-first Windows study tracker for CSIR-UGC NET Physical Sciences"
authors = ["CrimsonVisa"]
license = "MIT"
repository = "https://github.com/CrimsonVisa/csir-net-tracker"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "csir_net_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
